# ЛР 9. Neo4j 5.x + Graph Data Science у Docker.
services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26-community}
    container_name: lab09-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt (Python-драйвер, cypher-shell)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Задайте NEO4J_PASSWORD у файлі .env (мінімум 8 символів)}
      # Лише для Enterprise-образу (див. .env.example); для Community ігнорується
      NEO4J_ACCEPT_LICENSE_AGREEMENT: ${NEO4J_ACCEPT_LICENSE_AGREEMENT:-}
      # GDS завантажується при першому старті (потрібен доступ контейнера до інтернету)
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - ./data:/var/lib/neo4j/import
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_AUTH#neo4j/} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

volumes:
  neo4j_data:
  neo4j_plugins: